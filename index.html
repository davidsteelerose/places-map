<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>David's Places</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#0f1216; --panel:#171c22; --line:#26303a; --ink:#e8eef4; --dim:#93a3b1; --saved:#ffd166; --been:#5aa9e6; }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui,-apple-system,sans-serif; }
  #bar { position:absolute; z-index:500; left:10px; right:10px; top:10px; background:color-mix(in srgb, var(--panel) 92%, transparent); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  h1 { font-size:16px; margin:0 0 6px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .chip { border:1px solid var(--line); background:#131820; color:var(--ink); border-radius:999px; padding:7px 11px; font:inherit; font-size:14px; }
  .chip.on { border-color:currentColor; }
  .chip.saved { color:var(--saved); }
  .chip.been { color:var(--been); }
  #q { flex:1 1 140px; min-width:120px; background:#0b0e12; color:var(--ink); border:1px solid var(--line); border-radius:9px; padding:8px 10px; font:inherit; font-size:16px; }
  #status { color:var(--dim); font-size:12px; margin-top:6px; }
  #map { height:100%; }
  .leaflet-container { background:#0b0e12; }
  .leaflet-popup-content-wrapper { background:var(--panel); color:var(--ink); border-radius:12px; }
  .leaflet-popup-tip { background:var(--panel); }
</style>
</head>
<body>
<div id="bar">
  <h1>David's Places</h1>
  <div class="row">
    <button type="button" class="chip saved on" id="tog-saved" aria-pressed="true">Saved</button>
    <button type="button" class="chip been on" id="tog-been" aria-pressed="true">Where I've Been</button>
    <input id="q" type="search" placeholder="Search a city or name" autocomplete="off">
  </div>
  <div id="status">Loading…</div>
</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  var SAVED = "#ffd166", BEEN = "#5aa9e6";
  var showSaved = true, showBeen = true, query = "", payload = null;
  var layer = L.layerGroup();
  var map = L.map("map", { zoomControl: true }).setView([20, 0], 2);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 12,
    attribution: "&copy; OpenStreetMap"
  }).addTo(map);
  layer.addTo(map);
  function el(id) { return document.getElementById(id); }
  function fmtDay(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  }
  function matches(p) {
    if (p.kind === "saved" && !showSaved) return false;
    if (p.kind === "automated" && !showBeen) return false;
    var q = query.trim().toLowerCase();
    if (!q) return true;
    return [p.name, p.city, p.kind].join(" ").toLowerCase().indexOf(q) !== -1;
  }
  function draw() {
    layer.clearLayers();
    var places = (payload.places || []).filter(matches);
    var bounds = [];
    places.forEach(function (p) {
      var color = p.kind === "automated" ? BEEN : SAVED;
      var m = L.circleMarker([p.latitude, p.longitude], {
        radius: 7, color: color, weight: 2, fillColor: color, fillOpacity: 0.85
      });
      var kind = p.kind === "automated" ? "Where I've Been" : "Saved Places";
      var html = "<b>" + esc(p.name) + "</b><div style=\"color:#93a3b1;font-size:13px;margin-top:4px\">"
        + esc(kind) + (p.city && p.city !== p.name ? " · " + esc(p.city) : "")
        + (p.lastSeen ? " · " + esc(fmtDay(p.lastSeen)) : "")
        + "</div><div style=\"color:#93a3b1;font-size:12px;margin-top:6px\">Approximate location</div>";
      m.bindPopup(html);
      m.addTo(layer);
      bounds.push([p.latitude, p.longitude]);
    });
    el("status").textContent = places.length + " shown · snapshot, not live GPS";
    return bounds;
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function press(id, on) {
    var b = el(id);
    b.setAttribute("aria-pressed", on ? "true" : "false");
    b.classList.toggle("on", on);
  }
  el("tog-saved").onclick = function () { showSaved = !showSaved; press("tog-saved", showSaved); draw(); };
  el("tog-been").onclick = function () { showBeen = !showBeen; press("tog-been", showBeen); draw(); };
  el("q").oninput = function () { query = el("q").value; draw(); };
  fetch("places.json").then(function (r) { return r.json(); }).then(function (j) {
    payload = j;
    var bounds = draw();
    if (bounds.length) map.fitBounds(bounds, { padding: [48, 80], maxZoom: 10 });
  }).catch(function (err) {
    el("status").textContent = "Could not load places: " + err;
  });
})();
</script>
</body>
</html>
