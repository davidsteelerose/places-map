<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>David's Places</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#0f1216; --panel:#171c22; --line:#26303a; --ink:#e8eef4; --dim:#93a3b1; --saved:#ffd166; --been:#5aa9e6; --photo:#e07a5f; }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui,-apple-system,sans-serif; }
  #bar { position:absolute; z-index:500; left:10px; right:10px; top:10px; background:color-mix(in srgb, var(--panel) 92%, transparent); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  h1 { font-size:16px; margin:0 0 6px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .chip { border:1px solid var(--line); background:#131820; color:var(--ink); border-radius:999px; padding:7px 11px; font:inherit; font-size:14px; }
  .chip.on { border-color:currentColor; }
  .chip.saved { color:var(--saved); }
  .chip.been { color:var(--been); }
  .chip.photo { color:var(--photo); }
  .chip.range { color:var(--dim); }
  .chip.range.on { color:var(--ink); }
  #bar .row + .row { margin-top:6px; }
  .popup-photo { width:100%; max-width:240px; height:auto; border-radius:8px; display:block; margin-top:8px; }
  #q { flex:1 1 140px; min-width:120px; background:#0b0e12; color:var(--ink); border:1px solid var(--line); border-radius:9px; padding:8px 10px; font:inherit; font-size:16px; }
  #status { color:var(--dim); font-size:12px; margin-top:6px; }
  #map { height:100%; }
  .leaflet-container { background:#0b0e12; }
  .leaflet-popup-content-wrapper { background:var(--panel); color:var(--ink); border-radius:12px; }
  .leaflet-popup-tip { background:var(--panel); }
</style>
</head>
<body>
<div id="bar">
  <h1>David's Places</h1>
  <div class="row">
    <button type="button" class="chip saved on" id="tog-saved" aria-pressed="true">Saved</button>
    <button type="button" class="chip been on" id="tog-been" aria-pressed="true">Daily Snapshot</button>
    <button type="button" class="chip photo on" id="tog-photo" aria-pressed="true">Photos</button>
    <input id="q" type="search" placeholder="Search a city or name" autocomplete="off">
  </div>
  <div class="row" role="group" aria-label="When">
    <button type="button" class="chip range" id="tog-range-2d" aria-pressed="false">Last 2 Days</button>
    <button type="button" class="chip range" id="tog-range-90" aria-pressed="false">90 Days</button>
    <button type="button" class="chip range on" id="tog-range-all" aria-pressed="true">All</button>
  </div>
  <div id="status">Loading…</div>
</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  var SAVED = "#ffd166", BEEN = "#5aa9e6", PHOTO = "#e07a5f";
  var showSaved = true, showBeen = true, showPhoto = true, query = "", payload = null, photos = [];
  var rangeDays = 0;
  var RANGE_IDS = { 2: "tog-range-2d", 90: "tog-range-90", 0: "tog-range-all" };
  var layer = L.layerGroup();
  var map = L.map("map", { zoomControl: true }).setView([20, 0], 2);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 12,
    attribution: "&copy; OpenStreetMap"
  }).addTo(map);
  layer.addTo(map);
  function el(id) { return document.getElementById(id); }
  function fmtDay(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  }
  function ymdLocal(d) {
    var y = d.getFullYear();
    var m = d.getMonth() + 1;
    var day = d.getDate();
    return y + "-" + (m < 10 ? "0" : "") + m + "-" + (day < 10 ? "0" : "") + day;
  }
  function pinDay(iso) {
    return iso ? String(iso).slice(0, 10) : "";
  }
  function inWindow(iso) {
    if (!rangeDays) return true;
    var day = pinDay(iso);
    if (!day) return false;
    var now = new Date();
    var cutoff = new Date(now.getFullYear(), now.getMonth(), now.getDate() - (rangeDays - 1));
    return day >= ymdLocal(cutoff);
  }
  function rangeLabel() {
    if (rangeDays === 2) return "last 2 days";
    if (rangeDays === 90) return "90 days";
    return "all";
  }
  function matches(p) {
    if (p.kind === "saved" && !showSaved) return false;
    if (p.kind === "automated" && !showBeen) return false;
    if (p.kind === "automated" && !inWindow(p.lastSeen || p.firstSeen)) return false;
    var q = query.trim().toLowerCase();
    if (!q) return true;
    return [p.name, p.city, p.kind].join(" ").toLowerCase().indexOf(q) !== -1;
  }
  function draw() {
    layer.clearLayers();
    var places = (payload.places || []).filter(matches);
    var bounds = [];
    places.forEach(function (p) {
      var color = p.kind === "automated" ? BEEN : SAVED;
      var m = L.circleMarker([p.latitude, p.longitude], {
        radius: 7, color: color, weight: 2, fillColor: color, fillOpacity: 0.85
      });
      var kind = p.kind === "automated" ? "Daily Snapshot" : "Saved Places";
      var html = "<b>" + esc(p.name) + "</b><div style=\"color:#93a3b1;font-size:13px;margin-top:4px\">"
        + esc(kind) + (p.city && p.city !== p.name ? " · " + esc(p.city) : "")
        + (p.lastSeen ? " · " + esc(fmtDay(p.lastSeen)) : "")
        + "</div><div style=\"color:#93a3b1;font-size:12px;margin-top:6px\">Approximate location</div>";
      m.bindPopup(html);
      m.addTo(layer);
      bounds.push([p.latitude, p.longitude]);
    });
    var nPhoto = 0;
    if (showPhoto) {
      photos.forEach(function (ph) {
        if (!inWindow(ph.date)) return;
        var q = query.trim().toLowerCase();
        if (q && String(ph.date || "").indexOf(q) === -1) return;
        nPhoto += 1;
        var m = L.circleMarker([ph.latitude, ph.longitude], {
          radius: 8, color: PHOTO, weight: 2, fillColor: PHOTO, fillOpacity: 0.9
        });
        var src = ph.file || "";
        var html = "<b>Photo</b><div style=\"color:#93a3b1;font-size:13px;margin-top:4px\">"
          + (ph.date ? esc(ph.date) + " · " : "")
          + "Photo location</div>";
        if (src) html += "<img class=\"popup-photo\" alt=\"\" src=\"" + esc(src) + "\">";
        m.bindPopup(html, { maxWidth: 260 });
        m.addTo(layer);
        bounds.push([ph.latitude, ph.longitude]);
      });
    }
    el("status").textContent = places.length + " places" + (nPhoto ? " · " + nPhoto + " photos" : "") + " · " + rangeLabel() + " · snapshot, not live GPS";
    return bounds;
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function press(id, on) {
    var b = el(id);
    b.setAttribute("aria-pressed", on ? "true" : "false");
    b.classList.toggle("on", on);
  }
  el("tog-saved").onclick = function () { showSaved = !showSaved; press("tog-saved", showSaved); draw(); };
  el("tog-been").onclick = function () { showBeen = !showBeen; press("tog-been", showBeen); draw(); };
  el("tog-photo").onclick = function () { showPhoto = !showPhoto; press("tog-photo", showPhoto); draw(); };
  function setRange(days) {
    rangeDays = days;
    [2, 90, 0].forEach(function (d) { press(RANGE_IDS[d], d === rangeDays); });
    draw();
  }
  el("tog-range-2d").onclick = function () { setRange(2); };
  el("tog-range-90").onclick = function () { setRange(90); };
  el("tog-range-all").onclick = function () { setRange(0); };
  el("q").oninput = function () { query = el("q").value; draw(); };
  Promise.all([
    fetch("places.json").then(function (r) { return r.json(); }),
    fetch("photos.json").then(function (r) { return r.ok ? r.json() : { photos: [] }; }).catch(function () { return { photos: [] }; })
  ]).then(function (pair) {
    payload = pair[0];
    photos = (pair[1] && pair[1].photos) ? pair[1].photos : [];
    var bounds = draw();
    if (bounds.length) map.fitBounds(bounds, { padding: [48, 80], maxZoom: 10 });
  }).catch(function (err) {
    el("status").textContent = "Could not load places: " + err;
  });
})();
</script>
</body>
</html>
